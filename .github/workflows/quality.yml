name: AccordFlow quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.lock.txt
      - run: python -m ruff check backend rules_engine scripts tests
      - run: python -m ruff format --check backend rules_engine scripts tests
      - run: python -m scripts.secret_scan
      - run: python -m scripts.check_migrations
      - run: python -m pip_audit -r requirements.lock.txt
      - run: python -m pytest --cov=backend.app --cov=rules_engine --cov-report=xml:data/coverage.xml --junitxml=data/pytest.xml
      - run: npm ci && npm run build && npm audit --audit-level=high
        working-directory: frontend
      - run: python -m scripts.configure && python -m scripts.build_postman
      - run: npm ci
        working-directory: postman
      - run: python -m scripts.audit_postman
      - name: Start application containers
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Container failure diagnostics
        if: failure()
        run: |
          docker compose ps -a
          for container in $(docker compose ps -aq); do
            docker inspect --format '{{.Name}} {{json .State.Health}}' "$container"
          done
      - run: docker compose exec -T backend python -m scripts.verify_database
      - run: python -m scripts.run_newman
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
      - if: always()
        run: docker compose logs --no-color > data/compose.log
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qa-results
          path: |
            data/*results*
            data/pytest.xml
            data/coverage.xml
            data/playwright-report
            docs/screenshots
      - if: always()
        run: docker compose down
